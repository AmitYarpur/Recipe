<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9533d">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipe">
<title>Recipe</title>
<script>
  if (localStorage.getItem('recipe_theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">

    <!-- Screen: browse / search / filter -->
    <div id="browse-screen" class="screen active">
      <div class="top-bar">
        <div class="brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a3 3 0 0 0 3 3v8"/><path d="M6 3v6"/><path d="M9 3v6"/><path d="M18 3c-1.7 0-3 2-3 5s1.3 5 3 5v9"/></svg>
          </span>
          <h1 class="brand-title">מתכונים</h1>
        </div>
        <button class="icon-btn" id="theme-toggle-btn" aria-label="החלף מצב תצוגה">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>
      </div>

      <div class="search-row">
        <input class="search-input" id="search-input" type="text" placeholder="חיפוש מתכון לפי שם...">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>

      <div class="chip-row-wrap">
        <div class="chip-row" id="chip-row"></div>
        <div class="chip-fade chip-fade-left" id="chip-fade-left"></div>
        <div class="chip-fade chip-fade-right" id="chip-fade-right"></div>
      </div>

      <div class="recipe-frame">
        <div id="recipe-list" class="recipe-list"></div>

        <div id="empty-state" class="empty-state hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a3 3 0 0 0 3 3v8"/><path d="M6 3v6"/><path d="M9 3v6"/><path d="M18 3c-1.7 0-3 2-3 5s1.3 5 3 5v9"/></svg>
          <p id="empty-state-text">עדיין אין מתכונים. הוסיפו את המתכון הראשון!</p>
        </div>
      </div>
    </div>

    <!-- Screen: choose how to add a recipe -->
    <div id="add-choice-screen" class="screen">
      <div class="top-bar">
        <button class="icon-btn" id="choice-back-btn" aria-label="חזרה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="headline" style="margin:0;">מתכון חדש</h2>
        <span style="width:38px;"></span>
      </div>

      <div class="choice-list">
        <button type="button" class="choice-card" id="choice-link">
          <span class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>
          </span>
          <span class="choice-text">
            <span class="choice-title">לינק מרשת חברתית</span>
            <span class="choice-subtitle">יוטיוב, אינסטגרם, טיקטוק ועוד</span>
          </span>
          <svg class="choice-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>

        <button type="button" class="choice-card" id="choice-manual">
          <span class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M9.5 12h5M9.5 15h5M9.5 18h3"/></svg>
          </span>
          <span class="choice-text">
            <span class="choice-title">הוספה ידנית</span>
            <span class="choice-subtitle">כתבו את המצרכים ואופן ההכנה</span>
          </span>
          <svg class="choice-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>

        <button type="button" class="choice-card" id="choice-photo">
          <span class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.5A1 1 0 0 1 9 4h6a1 1 0 0 1 .9.5L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.4"/></svg>
          </span>
          <span class="choice-text">
            <span class="choice-title">צילום מתכון קיים</span>
            <span class="choice-subtitle">צלמו עמוד מתכון מספר בישול</span>
          </span>
          <svg class="choice-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
      </div>
    </div>

    <!-- Screen: add a recipe -->
    <div id="add-screen" class="screen">
      <div class="top-bar">
        <button class="icon-btn" id="add-back-btn" aria-label="חזרה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="headline" style="margin:0;" id="add-screen-title">מתכון חדש</h2>
        <span style="width:38px;"></span>
      </div>

      <div class="card">
        <div class="segmented" id="mode-segmented">
          <button type="button" class="segment-btn active" id="mode-link-btn">קישור</button>
          <button type="button" class="segment-btn" id="mode-manual-btn">הוספה ידנית</button>
          <button type="button" class="segment-btn" id="mode-photo-btn">צילום</button>
        </div>

        <div id="link-fields">
          <div class="field-group">
            <label class="field-label" for="recipe-link">קישור מהרשת החברתית</label>
            <input class="text-input" id="recipe-link" type="url" placeholder="https://...">
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="recipe-name">שם המתכון</label>
          <input class="text-input" id="recipe-name" type="text" placeholder="לדוגמה: פסטה ברוטב שמנת">
        </div>

        <div class="field-group">
          <label class="field-label" for="recipe-category">קטגוריה</label>
          <select class="select-input" id="recipe-category">
            <option value="" disabled selected>בחרו קטגוריה</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" id="photo-field-label">תמונה (אופציונלי)</label>
          <div id="photo-preview-wrap" class="hidden">
            <img id="photo-preview" class="photo-preview" alt="">
            <button type="button" class="btn-ghost btn-danger" id="remove-photo-btn">הסר תמונה</button>
          </div>
          <label class="photo-upload-btn" id="photo-upload-label">
            <input type="file" id="photo-input" accept="image/*" class="visually-hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="m21 16-5-4-8 7"/></svg>
            <span id="photo-upload-text">הוסף תמונה</span>
          </label>
        </div>

        <div id="manual-fields" class="hidden">
          <div class="field-group">
            <label class="field-label">מצרכים</label>
            <div class="dynamic-list" id="ingredients-list"></div>
            <button type="button" class="add-row-btn" id="add-ingredient-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              הוסף מצרך
            </button>
          </div>

          <div class="field-group">
            <label class="field-label">אופן הכנה</label>
            <div class="dynamic-list" id="instructions-list"></div>
            <button type="button" class="add-row-btn" id="add-instruction-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              הוסף שלב
            </button>
          </div>
        </div>

        <div class="error" id="add-error"></div>

        <button class="btn-primary" id="save-recipe-btn">שמור מתכון</button>
      </div>
    </div>

    <div class="fab" id="fab">
      <button class="fab-btn" id="fab-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        מתכון חדש
      </button>
    </div>

  </div>

  <!-- Recipe detail bottom sheet -->
  <div class="sheet-backdrop" id="detail-backdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <button type="button" class="detail-photo-wrap hidden" id="detail-photo-wrap" aria-label="הצג בגודל מלא">
        <img id="detail-photo" class="detail-photo" alt="">
        <span class="zoom-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m21 21-4.8-4.8"/><path d="M10.5 8v5M8 10.5h5"/></svg>
        </span>
      </button>
      <p class="sheet-title" id="detail-name"></p>
      <div class="recipe-meta" id="detail-meta" style="margin-top:6px;"></div>

      <div id="detail-ingredients-section" class="detail-section hidden">
        <h3>מצרכים</h3>
        <ol class="detail-list" id="detail-ingredients-list"></ol>
      </div>

      <div id="detail-instructions-section" class="detail-section hidden">
        <h3>אופן הכנה</h3>
        <ol class="detail-list" id="detail-instructions-list"></ol>
      </div>

      <div class="sheet-actions">
        <button class="btn-primary" id="detail-open-btn">פתח קישור</button>
        <button class="btn-ghost" id="detail-edit-btn">ערוך מתכון</button>
        <button class="btn-ghost btn-danger" id="detail-delete-btn">מחק מתכון</button>
        <button class="btn-ghost" id="detail-close-btn">סגור</button>
      </div>
    </div>
  </div>

  <!-- Full-screen photo viewer: pinch/pan zoom to read a photographed
       recipe page. Custom pointer-event zoom since the app's own viewport
       is fixed with user-scalable=no (needed everywhere else to keep the
       UI feeling like an app, not a webpage), so native pinch-zoom doesn't
       work here without this. -->
  <div class="photo-viewer" id="photo-viewer">
    <button class="photo-viewer-close" id="photo-viewer-close" aria-label="סגור">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="photo-viewer-stage" id="photo-viewer-stage">
      <img id="photo-viewer-img" alt="">
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { CATEGORIES, addRecipe, updateRecipe, getRecipes, deleteRecipe } from './db.js';

    const PLATFORM_LABELS = { youtube: 'יוטיוב', instagram: 'אינסטגרם', tiktok: 'טיקטוק', facebook: 'פייסבוק', other: 'קישור', manual: 'הוספה ידנית', photo: 'מתכון מצולם' };

    const PLATFORM_ICONS = {
      youtube: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3V9Z" fill="currentColor" stroke="none"/></svg>',
      instagram: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v10.5a3.5 3.5 0 1 1-3-3.46"/><path d="M14 3c0 3 2 5 5 5"/></svg>',
      facebook: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M14.5 8.5h-1.7c-.7 0-1.3.6-1.3 1.3V11h3l-.4 2.5h-2.6V19h-2.5v-5.5H7V11h1.9V9.5c0-1.9 1.3-3.2 3.2-3.2h2.4v2.2Z" fill="currentColor" stroke="none"/></svg>',
      other: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></svg>',
      manual: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M9.5 12h5M9.5 15h5M9.5 18h3"/></svg>',
      photo: '<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2.2"/><path d="m21 16-5-4-8 7"/></svg>'
    };

    // Manual and photographed recipes only ever have the uploaded photo, so
    // it's the obvious choice there. Link recipes prefer the source site's
    // own thumbnail - it's what the video actually looks like - and only
    // fall back to a personal photo if one was added and the site had none.
    function pickDisplayImage(r) {
      if (r.platform === 'manual' || r.platform === 'photo') return { src: r.photoDataUrl || null, isVideoThumb: false };
      if (r.thumbnailUrl) return { src: r.thumbnailUrl, isVideoThumb: true };
      if (r.photoDataUrl) return { src: r.photoDataUrl, isVideoThumb: false };
      return { src: null, isVideoThumb: false };
    }

    let allRecipes = [];
    let currentCategory = 'הכל';
    let currentSearch = '';
    let activeRecipe = null;
    let addMode = 'link';
    let editingRecipeId = null;

    // --- theme ---------------------------------------------------------
    function applyThemeIcon() {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('theme-icon').innerHTML = dark
        ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'
        : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
    }
    document.getElementById('theme-toggle-btn').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('recipe_theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('recipe_theme', 'dark');
      }
      applyThemeIcon();
    });
    applyThemeIcon();

    // --- toast -----------------------------------------------------------
    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    // --- category chips + select options ---------------------------------
    const chipRow = document.getElementById('chip-row');
    ['הכל', ...CATEGORIES].forEach(cat => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (cat === currentCategory ? ' active' : '');
      chip.textContent = cat;
      chip.addEventListener('click', () => {
        currentCategory = cat;
        [...chipRow.children].forEach(c => c.classList.toggle('active', c.textContent === cat));
        renderList();
      });
      chipRow.appendChild(chip);
    });

    // Uses each edge chip's own bounding box rather than chipRow.scrollLeft,
    // since RTL scroll-position sign conventions differ across browsers -
    // comparing element edges to the container edge works the same way
    // everywhere and needs no per-browser special-casing.
    function updateChipFades() {
      const fadeLeft = document.getElementById('chip-fade-left');
      const fadeRight = document.getElementById('chip-fade-right');
      const first = chipRow.firstElementChild;
      const last = chipRow.lastElementChild;
      if (!first || !last) return;

      const containerRect = chipRow.getBoundingClientRect();
      const firstRect = first.getBoundingClientRect();
      const lastRect = last.getBoundingClientRect();
      const TOLERANCE = 2;

      // First chip ("הכל") sits at the row's right edge at rest - if its
      // right side is pushed past the container's right edge, we've
      // scrolled away from the start and there's more to the right.
      fadeRight.classList.toggle('visible', firstRect.right > containerRect.right + TOLERANCE);
      // Last chip sits furthest left - if its left side hasn't reached the
      // container's left edge yet, there's more still hidden that way.
      fadeLeft.classList.toggle('visible', lastRect.left < containerRect.left - TOLERANCE);
    }
    chipRow.addEventListener('scroll', updateChipFades, { passive: true });
    window.addEventListener('resize', updateChipFades);
    updateChipFades();

    const categorySelect = document.getElementById('recipe-category');
    CATEGORIES.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });

    // --- screens -----------------------------------------------------------
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.getElementById('fab').classList.toggle('hidden', id !== 'browse-screen');
    }

    // --- add-recipe mode toggle (link / manual / photo) ----------------------
    function setAddMode(mode) {
      addMode = mode;
      document.getElementById('mode-link-btn').classList.toggle('active', mode === 'link');
      document.getElementById('mode-manual-btn').classList.toggle('active', mode === 'manual');
      document.getElementById('mode-photo-btn').classList.toggle('active', mode === 'photo');
      document.getElementById('link-fields').classList.toggle('hidden', mode !== 'link');
      document.getElementById('manual-fields').classList.toggle('hidden', mode !== 'manual');

      // Photo mode has no link/ingredients/steps - the photo itself is the
      // whole recipe, so it's required rather than optional here, and the
      // file picker defaults to the camera (this is meant to be a page from
      // a physical cookbook, photographed right now).
      const photoInput = document.getElementById('photo-input');
      if (mode === 'photo') {
        document.getElementById('photo-field-label').textContent = 'תמונה';
        document.getElementById('photo-upload-text').textContent = 'צלמו את המתכון';
        photoInput.setAttribute('capture', 'environment');
      } else {
        document.getElementById('photo-field-label').textContent = 'תמונה (אופציונלי)';
        document.getElementById('photo-upload-text').textContent = 'הוסף תמונה';
        photoInput.removeAttribute('capture');
      }
    }
    document.getElementById('mode-link-btn').addEventListener('click', () => setAddMode('link'));
    document.getElementById('mode-manual-btn').addEventListener('click', () => setAddMode('manual'));
    document.getElementById('mode-photo-btn').addEventListener('click', () => setAddMode('photo'));

    // --- photo upload ----------------------------------------------------------
    // undefined = no change (edit only, leaves any existing photo alone),
    // null = no photo / explicitly removed, string = new data URL to save.
    let selectedPhoto = null;
    const MAX_PHOTO_CHARS = 900000; // stays well under Firestore's 1MiB document cap

    function showPhotoPreview(src) {
      const wrap = document.getElementById('photo-preview-wrap');
      document.getElementById('photo-preview').src = src;
      wrap.classList.remove('hidden');
      document.getElementById('photo-upload-label').classList.add('hidden');
    }
    function hidePhotoPreview() {
      document.getElementById('photo-preview-wrap').classList.add('hidden');
      document.getElementById('photo-upload-label').classList.remove('hidden');
      document.getElementById('photo-preview').src = '';
    }

    function loadImage(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('קובץ התמונה פגום או לא נתמך.'));
        img.src = dataUrl;
      });
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('לא ניתן לקרוא את קובץ התמונה.'));
        reader.readAsDataURL(file);
      });
    }

    function drawResized(img, maxDim, quality) {
      let { width, height } = img;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      return canvas.toDataURL('image/jpeg', quality);
    }

    // Resizes/compresses client-side so the result comfortably fits inside a
    // single Firestore document (no Storage bucket behind this - see db.js).
    // Retries at lower quality/dimensions if a large source photo still
    // doesn't fit, rather than failing outright.
    async function compressImageFile(file) {
      if (file.size > 15 * 1024 * 1024) throw new Error('קובץ התמונה גדול מדי (מעל 15MB).');
      const raw = await readFileAsDataUrl(file);
      const img = await loadImage(raw);

      const attempts = [[900, 0.7], [900, 0.5], [640, 0.5], [480, 0.4]];
      let result = null;
      for (const [maxDim, quality] of attempts) {
        result = drawResized(img, maxDim, quality);
        if (result.length <= MAX_PHOTO_CHARS) return result;
      }
      throw new Error('התמונה גדולה מדי גם לאחר דחיסה. נסו תמונה אחרת.');
    }

    document.getElementById('photo-input').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const errorEl = document.getElementById('add-error');
      errorEl.textContent = '';
      try {
        const dataUrl = await compressImageFile(file);
        selectedPhoto = dataUrl;
        showPhotoPreview(dataUrl);
      } catch (err) {
        errorEl.textContent = err.message || 'שגיאה בטעינת התמונה.';
      } finally {
        e.target.value = '';
      }
    });

    document.getElementById('remove-photo-btn').addEventListener('click', () => {
      selectedPhoto = null;
      hidePhotoPreview();
    });

    // --- dynamic ingredient / instruction rows --------------------------------
    function addDynamicRow(containerId, placeholder) {
      const container = document.getElementById(containerId);
      const row = document.createElement('div');
      row.className = 'dynamic-row';
      row.innerHTML = `
        <span class="row-index"></span>
        <input class="text-input" type="text" placeholder="${placeholder}">
        <button type="button" class="row-remove-btn" aria-label="הסר">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      `;
      row.querySelector('.row-remove-btn').addEventListener('click', () => {
        row.remove();
        renumberRows(containerId);
      });
      container.appendChild(row);
      renumberRows(containerId);
      return row;
    }

    function renumberRows(containerId) {
      const container = document.getElementById(containerId);
      [...container.children].forEach((row, i) => {
        row.querySelector('.row-index').textContent = i + 1;
      });
    }

    function resetDynamicList(containerId, placeholder) {
      document.getElementById(containerId).innerHTML = '';
      addDynamicRow(containerId, placeholder);
    }

    // Rebuilds the row list from existing values (used when opening a
    // recipe for editing) - one row per item, or a single empty row if
    // there's nothing saved yet.
    function fillDynamicList(containerId, items, placeholder) {
      document.getElementById(containerId).innerHTML = '';
      const values = items && items.length ? items : [''];
      values.forEach(val => {
        addDynamicRow(containerId, placeholder).querySelector('input').value = val;
      });
    }

    function collectDynamicValues(containerId) {
      return [...document.getElementById(containerId).querySelectorAll('input')].map(i => i.value);
    }

    document.getElementById('add-ingredient-btn').addEventListener('click', () => addDynamicRow('ingredients-list', 'לדוגמה: 2 כוסות קמח'));
    document.getElementById('add-instruction-btn').addEventListener('click', () => addDynamicRow('instructions-list', 'לדוגמה: לערבב את כל המרכיבים היבשים'));

    // Tapping the fab opens the 3-option chooser rather than the form
    // directly; each option below resets the form for a fresh recipe in
    // that mode and jumps straight past the chooser into it.
    document.getElementById('fab-btn').addEventListener('click', () => showScreen('add-choice-screen'));
    document.getElementById('choice-back-btn').addEventListener('click', () => showScreen('browse-screen'));

    function resetAddForm(mode) {
      editingRecipeId = null;
      document.getElementById('add-screen-title').textContent = 'מתכון חדש';
      document.getElementById('save-recipe-btn').textContent = 'שמור מתכון';
      document.getElementById('recipe-link').value = '';
      document.getElementById('recipe-name').value = '';
      categorySelect.selectedIndex = 0;
      document.getElementById('add-error').textContent = '';
      resetDynamicList('ingredients-list', 'לדוגמה: 2 כוסות קמח');
      resetDynamicList('instructions-list', 'לדוגמה: לערבב את כל המרכיבים היבשים');
      selectedPhoto = null;
      hidePhotoPreview();
      setAddMode(mode);
    }

    document.getElementById('choice-link').addEventListener('click', () => { resetAddForm('link'); showScreen('add-screen'); });
    document.getElementById('choice-manual').addEventListener('click', () => { resetAddForm('manual'); showScreen('add-screen'); });
    document.getElementById('choice-photo').addEventListener('click', () => { resetAddForm('photo'); showScreen('add-screen'); });

    // New-recipe flow came from the chooser, so cancelling goes back there;
    // editing a recipe skipped the chooser entirely, so it goes straight
    // back to the list.
    document.getElementById('add-back-btn').addEventListener('click', () => {
      showScreen(editingRecipeId ? 'browse-screen' : 'add-choice-screen');
    });

    // --- edit recipe -----------------------------------------------------------
    function openEditScreen(recipe) {
      editingRecipeId = recipe.id;
      document.getElementById('add-screen-title').textContent = 'עריכת מתכון';
      document.getElementById('save-recipe-btn').textContent = 'עדכן מתכון';
      document.getElementById('add-error').textContent = '';

      document.getElementById('recipe-name').value = recipe.name;
      categorySelect.value = recipe.category;

      // undefined = keep whatever photo the recipe already has unless the
      // user actively changes it (see the photo-input/remove-photo-btn
      // handlers, which overwrite this with a string or null).
      selectedPhoto = undefined;
      if (recipe.photoDataUrl) {
        showPhotoPreview(recipe.photoDataUrl);
      } else {
        hidePhotoPreview();
      }

      if (recipe.platform === 'manual') {
        setAddMode('manual');
        document.getElementById('recipe-link').value = '';
        fillDynamicList('ingredients-list', recipe.ingredients, 'לדוגמה: 2 כוסות קמח');
        fillDynamicList('instructions-list', recipe.instructions, 'לדוגמה: לערבב את כל המרכיבים היבשים');
      } else if (recipe.platform === 'photo') {
        setAddMode('photo');
        document.getElementById('recipe-link').value = '';
        resetDynamicList('ingredients-list', 'לדוגמה: 2 כוסות קמח');
        resetDynamicList('instructions-list', 'לדוגמה: לערבב את כל המרכיבים היבשים');
      } else {
        setAddMode('link');
        document.getElementById('recipe-link').value = recipe.link || '';
        resetDynamicList('ingredients-list', 'לדוגמה: 2 כוסות קמח');
        resetDynamicList('instructions-list', 'לדוגמה: לערבב את כל המרכיבים היבשים');
      }

      showScreen('add-screen');
    }

    // --- list rendering ------------------------------------------------------
    function renderList() {
      const list = document.getElementById('recipe-list');
      const empty = document.getElementById('empty-state');
      const search = currentSearch.trim().toLowerCase();

      const filtered = allRecipes.filter(r => {
        const matchesCategory = currentCategory === 'הכל' || r.category === currentCategory;
        const matchesSearch = !search || r.name.toLowerCase().includes(search);
        return matchesCategory && matchesSearch;
      });

      list.innerHTML = '';
      if (filtered.length === 0) {
        empty.classList.remove('hidden');
        document.getElementById('empty-state-text').textContent = allRecipes.length === 0
          ? 'עדיין אין מתכונים. הוסיפו את המתכון הראשון!'
          : 'לא נמצאו מתכונים תואמים.';
        return;
      }
      empty.classList.add('hidden');

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';

        const thumb = document.createElement('div');
        thumb.className = 'recipe-thumb';
        const { src: thumbSrc, isVideoThumb } = pickDisplayImage(r);
        if (thumbSrc) {
          thumb.style.backgroundImage = `url("${thumbSrc}")`;
          if (isVideoThumb) {
            thumb.innerHTML = '<div class="play-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></svg></div>';
          }
        } else if (r.platform === 'manual' || r.platform === 'photo') {
          thumb.innerHTML = PLATFORM_ICONS[r.platform] + `<span class="thumb-manual-label">${PLATFORM_LABELS[r.platform]}</span>`;
        } else {
          thumb.innerHTML = PLATFORM_ICONS[r.platform] || PLATFORM_ICONS.other;
        }

        const info = document.createElement('div');
        info.className = 'recipe-info';
        info.innerHTML = `
          <p class="recipe-name">${escapeHtml(r.name)}</p>
          <div class="recipe-meta">
            <span class="badge badge-accent">${escapeHtml(r.category)}</span>
            <span class="platform-tag">${PLATFORM_LABELS[r.platform] || PLATFORM_LABELS.other}</span>
          </div>
        `;

        card.appendChild(thumb);
        card.appendChild(info);
        card.addEventListener('click', () => openDetail(r));
        list.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('search-input').addEventListener('input', e => {
      currentSearch = e.target.value;
      renderList();
    });

    // --- detail sheet -------------------------------------------------------
    function renderDetailList(sectionId, listId, items) {
      const section = document.getElementById(sectionId);
      const list = document.getElementById(listId);
      if (!items || items.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');
      list.innerHTML = items.map((item, i) => `<li><span class="num">${i + 1}</span><span>${escapeHtml(item)}</span></li>`).join('');
    }

    function openDetail(recipe) {
      activeRecipe = recipe;
      document.getElementById('detail-name').textContent = recipe.name;
      document.getElementById('detail-meta').innerHTML = `
        <span class="badge badge-accent">${escapeHtml(recipe.category)}</span>
        <span class="platform-tag">${PLATFORM_LABELS[recipe.platform] || PLATFORM_LABELS.other}</span>
      `;

      const photoEl = document.getElementById('detail-photo');
      const photoWrap = document.getElementById('detail-photo-wrap');
      const { src: detailImage } = pickDisplayImage(recipe);
      if (detailImage) {
        photoEl.src = detailImage;
        photoWrap.classList.remove('hidden');
      } else {
        photoWrap.classList.add('hidden');
        photoEl.src = '';
      }

      const isManual = recipe.platform === 'manual';
      const hasLink = recipe.platform !== 'manual' && recipe.platform !== 'photo';
      document.getElementById('detail-open-btn').classList.toggle('hidden', !hasLink);
      renderDetailList('detail-ingredients-section', 'detail-ingredients-list', isManual ? recipe.ingredients : null);
      renderDetailList('detail-instructions-section', 'detail-instructions-list', isManual ? recipe.instructions : null);

      document.getElementById('detail-backdrop').classList.add('active');
    }
    function closeDetail() {
      document.getElementById('detail-backdrop').classList.remove('active');
      activeRecipe = null;
    }
    document.getElementById('detail-close-btn').addEventListener('click', closeDetail);
    document.getElementById('detail-backdrop').addEventListener('click', e => {
      if (e.target.id === 'detail-backdrop') closeDetail();
    });
    document.getElementById('detail-open-btn').addEventListener('click', () => {
      // window.open(..., '_blank') spawns a whole new blank browser tab in
      // an installed (standalone) PWA before the OS hands it off to the
      // native app - that empty tab is then left behind for the user to
      // close manually. Navigating the current window instead means there's
      // nothing extra left over: switching back (swipe/app-switcher) simply
      // returns to this same PWA window, still showing this recipe.
      if (activeRecipe) window.location.href = activeRecipe.link;
    });
    document.getElementById('detail-edit-btn').addEventListener('click', () => {
      if (!activeRecipe) return;
      const recipe = activeRecipe;
      closeDetail();
      openEditScreen(recipe);
    });
    document.getElementById('detail-delete-btn').addEventListener('click', async () => {
      if (!activeRecipe) return;
      if (!confirm(`למחוק את "${activeRecipe.name}"?`)) return;
      const id = activeRecipe.id;
      try {
        await deleteRecipe(id);
        allRecipes = allRecipes.filter(r => r.id !== id);
        closeDetail();
        renderList();
        showToast('המתכון נמחק');
      } catch (e) {
        showToast(e.message || 'שגיאה במחיקה');
      }
    });

    // --- full-screen photo viewer (pinch/pan zoom) -----------------------------
    // The page's own viewport is locked (user-scalable=no) so the whole app
    // feels like an app rather than a zoomable webpage - that means native
    // pinch-zoom doesn't reach this image either, so zoom/pan is tracked by
    // hand from pointer events and applied as a CSS transform. Built to read
    // a photographed cookbook page, but works for any recipe photo.
    (function setupPhotoViewer() {
      const viewer = document.getElementById('photo-viewer');
      const stage = document.getElementById('photo-viewer-stage');
      const img = document.getElementById('photo-viewer-img');

      const MIN_SCALE = 1;
      const MAX_SCALE = 5;
      let scale = 1, tx = 0, ty = 0;
      const pointers = new Map();
      let pinchStartDist = null;
      let panStart = null; // { x, y, tx, ty } at gesture start
      let lastTapTime = 0;

      function apply() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }

      function resetZoom() {
        scale = 1; tx = 0; ty = 0;
        apply();
      }

      function clampScale(s) {
        return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
      }

      function open(src) {
        img.src = src;
        resetZoom();
        viewer.classList.add('active');
      }
      function close() {
        viewer.classList.remove('active');
        img.src = '';
      }

      document.getElementById('detail-photo-wrap').addEventListener('click', () => {
        const src = document.getElementById('detail-photo').src;
        if (src) open(src);
      });
      document.getElementById('photo-viewer-close').addEventListener('click', close);
      viewer.addEventListener('click', e => { if (e.target === viewer) close(); });

      function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

      stage.addEventListener('pointerdown', e => {
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone - ignore */ }
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) {
          panStart = { x: e.clientX, y: e.clientY, tx, ty };
        } else if (pointers.size === 2) {
          panStart = null;
          pinchStartDist = dist(...pointers.values());
        }
      });

      stage.addEventListener('pointermove', e => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1 && panStart && scale > 1) {
          tx = panStart.tx + (e.clientX - panStart.x);
          ty = panStart.ty + (e.clientY - panStart.y);
          apply();
        } else if (pointers.size === 2 && pinchStartDist) {
          const d = dist(...pointers.values());
          scale = clampScale(scale * (d / pinchStartDist));
          pinchStartDist = d;
          apply();
        }
      });

      function endPointer(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchStartDist = null;
        if (pointers.size === 0) {
          panStart = null;
          if (scale <= 1) resetZoom();

          // Double-tap to toggle zoom, once no fingers remain on screen.
          const now = Date.now();
          if (now - lastTapTime < 300) {
            scale = scale > 1 ? 1 : 2.5;
            tx = 0; ty = 0;
            apply();
          }
          lastTapTime = now;
        }
      }
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', endPointer);
    })();

    // --- add recipe -----------------------------------------------------------
    document.getElementById('save-recipe-btn').addEventListener('click', async () => {
      const btn = document.getElementById('save-recipe-btn');
      const errorEl = document.getElementById('add-error');
      const name = document.getElementById('recipe-name').value;
      const category = categorySelect.value;
      let values;
      if (addMode === 'manual') {
        values = {
          mode: 'manual',
          name,
          category,
          ingredients: collectDynamicValues('ingredients-list'),
          instructions: collectDynamicValues('instructions-list')
        };
      } else if (addMode === 'photo') {
        values = { mode: 'photo', name, category };
      } else {
        values = { mode: 'link', link: document.getElementById('recipe-link').value, name, category };
      }
      values.photo = selectedPhoto;
      errorEl.textContent = '';
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        if (editingRecipeId) {
          await updateRecipe(editingRecipeId, values);
          showScreen('browse-screen');
          showToast('המתכון עודכן בהצלחה');
        } else {
          await addRecipe(values);
          showScreen('browse-screen');
          showToast('המתכון נוסף בהצלחה');
        }
        await loadRecipes();
      } catch (e) {
        errorEl.textContent = e.message || 'שגיאה בשמירת המתכון.';
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });

    // --- initial load -----------------------------------------------------------
    async function loadRecipes() {
      try {
        allRecipes = await getRecipes();
        renderList();
      } catch (e) {
        document.getElementById('empty-state').classList.remove('hidden');
        document.getElementById('empty-state-text').textContent = e.message || 'שגיאה בטעינת המתכונים.';
      }
    }

    loadRecipes();
  </script>
</body>
</html>
